<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIARA '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Goldman:wght@400;700&family=Montserrat:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Tiara';
            src: url('tiara.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

       
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050102;
            color: #ffffff;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            position: relative;
            user-select: none;
        }

        /* Dynamic Root variables for dynamic calculation in JS */
        :root {
            --tile-w: 300px;
            --tile-h: 152px;
            --tile-gap: 16px;
            --drift-rotate-x: 14deg;
            --drift-rotate-y: -12deg;
        }

        /* ═══════════════════════════════════════════════════
           DRIFT WALL — Responsive 3D Tile Background
           ═══════════════════════════════════════════════════ */
        .drift-wall {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            perspective: 1000px;
            pointer-events: none;
        }

        .drift-plane {
            display: flex;
            gap: var(--tile-gap);
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            transform: rotateX(var(--drift-rotate-x)) rotateY(var(--drift-rotate-y));
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        .drift-column {
            display: flex;
            flex-direction: column;
            gap: var(--tile-gap);
            flex-shrink: 0;
            width: var(--tile-w);
            will-change: transform;
        }

        .drift-tile {
            flex-shrink: 0;
            width: var(--tile-w);
            height: var(--tile-h);
            border-radius: clamp(8px, 1.5vw, 14px);
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            background: #120305;
        }

        .drift-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(1.4) hue-rotate(-10deg) brightness(0.65);
            transition: opacity 0.3s ease;
        }

        /* Crimson tint overlay on tiles */
        .drift-tile::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(160, 10, 25, 0.4), rgba(40, 2, 5, 0.6));
            pointer-events: none;
        }

        /* Multi-directional Edge Vignettes for enhanced text legibility */
        .drift-wall::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                    rgba(5, 1, 2, 1) 0%,
                    rgba(5, 1, 2, 0.75) 15%,
                    rgba(5, 1, 2, 0.1) 40%,
                    rgba(5, 1, 2, 0) 50%);
            pointer-events: none;
            z-index: 1;
        }

        .drift-wall::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(5, 1, 2, 1) 0%,
                    rgba(5, 1, 2, 0.85) 20%,
                    rgba(5, 1, 2, 0.3) 50%,
                    rgba(5, 1, 2, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Left/Right Vignette overlay for tight displays */
        .side-vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(to right,
                    rgba(5, 1, 2, 0.85) 0%,
                    rgba(5, 1, 2, 0) 20%,
                    rgba(5, 1, 2, 0) 80%,
                    rgba(5, 1, 2, 0.85) 100%);
        }

        /* ═══════════════════════════════════════════════════
           FOG CANVAS — Particle Effect Container (Full Width)
           ═══════════════════════════════════════════════════ */
        #myCanvas {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 40vh;
            max-height: 320px;
            object-fit: cover;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        #myCanvas.revealed {
            opacity: 0.9;
        }

        /* Hero Content Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 1.2rem;
            text-align: center;
        }

        /* TIARA '26 Main Heading — Left offset applied to compensate for 'T' wing */
        h1.target-tiara {
            font-family: 'Tiara', 'Cinzel', serif;
            font-size: clamp(2.8rem, 11vw, 8.5rem);
            font-weight: 900;
            line-height: 0.95;
            margin: 0;
            padding: 0;
            white-space: nowrap;
            display: inline-block;
            text-align: center;
            letter-spacing: -0.02em;
            text-shadow: 0 0 30px rgba(235, 28, 44, 0.35), 0 10px 20px rgba(0, 0, 0, 0.8);
            transform: translateX(clamp(-28px, -1.8vw, -10px));
        }

        /* Pad-synced Letter Groups */
        .letter-group {
            display: inline-block;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.94) translateZ(0);
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .letter-group.revealed {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateZ(0);
        }

        .text-white {
            color: #ffffff;
        }

        .text-red {
            color: #EB1C2C;
            text-shadow: 0 0 20px rgba(235, 28, 44, 0.6);
        }

        .lg-quote-26 {
            margin-left: clamp(10px, 1.4vw, 24px);
        }

        /* Coming Soon Subtitle */
        h2.target-coming-soon {
            font-family: 'Goldman', sans-serif;
            font-size: clamp(0.75rem, 2.2vw, 1.3rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: clamp(4px, 1.8vw, 16px);
            color: rgba(255, 255, 255, 0.92);
            margin-top: clamp(14px, 2.5vh, 26px);
            margin-left: clamp(14px, 1.8vw, 32px);
            padding: 0;
            display: inline-block;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h2.target-coming-soon.revealed {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        /* ═══════════════════════════════════════════════════
           EMBERS — Floating Retro Sparks from Fog
           ═══════════════════════════════════════════════════ */
        #embersCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        #embersCanvas.revealed {
            opacity: 1;
        }


        /* Responsive adjustments for phones (< 600px) */
        @media (max-width: 600px) {
            :root {
                --drift-rotate-x: 10deg;
                --drift-rotate-y: -8deg;
            }

            #myCanvas {
                height: 45vh;
            }

            h1.target-tiara {
                letter-spacing: -0.01em;
                transform: translateX(-12px);
                /* Tighter offset on narrow screens */
            }

        }
    </style>
</head>

<body>

    <!-- DriftWall Background -->
    <div class="drift-wall" id="driftWall">
        <div class="drift-plane" id="driftPlane"></div>
    </div>

    <!-- Side Edge Vignette Overlay -->
    <div class="side-vignette"></div>

    <!-- Embers Canvas (upper area sparks) -->
    <canvas id="embersCanvas"></canvas>

    <!-- Fog Canvas -->
    <canvas id="myCanvas" width="1600" height="250"></canvas>

    <!-- Main Teaser Container -->
    <div class="container">
        <h1 class="target-tiara">
            <span class="letter-group lg-ti text-white">Ti</span><span class="letter-group lg-ar text-red">ar</span><span class="letter-group lg-a text-white">a</span><span class="letter-group lg-quote-26"><span class="text-red quote-mark">&apos;</span><span class="text-white">26</span></span>
        </h1>
        <h2 class="target-coming-soon">Coming Soon</h2>
    </div>

    <!-- Audio -->
    <audio id="bgm" preload="auto" src="apalonbeats-suspenseful-566692.mp3"></audio>

    <!-- Intro Overlay -->
    <div id="intro-overlay">
        <div class="intro-prompt" id="promptBox">
            <span class="intro-icon">🎧</span>
            Use earphones for best experience
        </div>
        <button class="intro-btn" id="enterBtn">ENTER</button>
    </div>

    <style>
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: #050102;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: clamp(20px, 4vh, 36px);
            padding: clamp(20px, 5vw, 40px);
            transition: opacity 0.2s ease-out;
            will-change: opacity;
        }

        .intro-prompt {
            font-family: 'Goldman', sans-serif;
            font-size: clamp(0.85rem, 2.5vw, 1.35rem);
            font-weight: 700;
            letter-spacing: clamp(3px, 1.2vw, 8px);
            color: rgba(255, 255, 255, 0.92);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(235, 28, 44, 0.5);
            animation: introGlow 2.5s infinite alternate ease-in-out;
            line-height: 1.5;
        }

        .intro-icon {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            display: block;
            margin-bottom: clamp(8px, 1.5vh, 16px);
            filter: drop-shadow(0 0 15px rgba(235, 28, 44, 0.6));
        }

        @keyframes introGlow {
            0% { opacity: 0.8; text-shadow: 0 0 15px rgba(235, 28, 44, 0.3); }
            100% { opacity: 1; text-shadow: 0 0 30px rgba(235, 28, 44, 0.8), 0 0 60px rgba(235, 28, 44, 0.4); }
        }

        .intro-btn {
            font-family: 'Goldman', sans-serif;
            padding: clamp(14px, 2.2vh, 18px) clamp(36px, 6vw, 60px);
            font-size: clamp(0.95rem, 3.2vw, 1.35rem);
            font-weight: 700;
            letter-spacing: clamp(4px, 1.2vw, 8px);
            background: transparent;
            color: #ffffff;
            border: 2px solid #EB1C2C;
            border-radius: 4px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(235, 28, 44, 0.3);
            animation: introPulse 2s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .intro-btn:hover, .intro-btn:active {
            background: #EB1C2C;
            box-shadow: 0 0 35px rgba(235, 28, 44, 0.8);
            transform: scale(1.05);
        }

        @keyframes introPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 1; }
        }
    </style>

    <script>
        (function () {
            var audio = document.getElementById('bgm');
            var overlay = document.getElementById('intro-overlay');
            var started = false;

            var hit1Done = false; // 0.0s -> TI
            var hit2Done = false; // 3.18s -> AR
            var hit3Done = false; // 6.35s -> A
            var hit4Done = false; // 9.60s -> '26
            var fullDropDone = false; // 12.85s -> Full page

            function revealHit1() {
                if (hit1Done) return;
                hit1Done = true;
                var el = document.querySelector('.lg-ti');
                if (el) el.classList.add('revealed');
            }

            function revealHit2() {
                if (hit2Done) return;
                hit2Done = true;
                var el = document.querySelector('.lg-ar');
                if (el) el.classList.add('revealed');
            }

            function revealHit3() {
                if (hit3Done) return;
                hit3Done = true;
                var el = document.querySelector('.lg-a');
                if (el) el.classList.add('revealed');
            }

            function revealHit4() {
                if (hit4Done) return;
                hit4Done = true;
                var el = document.querySelector('.lg-quote-26');
                if (el) el.classList.add('revealed');
            }

            function revealFullDrop() {
                if (fullDropDone) return;
                fullDropDone = true;
                window.comingSoonPageAppeared = true;

                revealHit1();
                revealHit2();
                revealHit3();
                revealHit4();

                var smoke = document.getElementById('myCanvas');
                var embers = document.getElementById('embersCanvas');
                var cs = document.querySelector('.target-coming-soon');

                if (smoke) smoke.classList.add('revealed');
                if (embers) embers.classList.add('revealed');
                if (cs) cs.classList.add('revealed');

                if (typeof window.initComingSoonVFX === 'function') {
                    window.initComingSoonVFX();
                }
            }

            function startExperience() {
                if (started) return;
                started = true;

                // Immediately hide overlay without lag
                overlay.style.pointerEvents = 'none';
                overlay.style.opacity = '0';
                setTimeout(function () {
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                }, 220);

                // Pad 1 reveals immediately on enter tap
                revealHit1();

                // Play audio from start natively
                try {
                    audio.currentTime = 0;
                    audio.volume = 1;
                    var p = audio.play();
                    if (p && typeof p.catch === 'function') {
                        p.catch(function () {});
                    }
                } catch (err) {}

                // Run audio tracking loop
                requestAnimationFrame(trackAudio);

                // Fallback timers in case audio.currentTime is deferred
                setTimeout(revealHit2, 3180);
                setTimeout(revealHit3, 6350);
                setTimeout(revealHit4, 9600);
                setTimeout(revealFullDrop, 12850);
            }

            function trackAudio() {
                if (!audio) return;
                var cur = audio.currentTime;
                var dur = audio.duration;

                // Pad 1: 0.0s -> TI
                if (cur >= 0.0) revealHit1();

                // Pad 2: 3.18s -> AR
                if (cur >= 3.18) revealHit2();

                // Pad 3: 6.35s -> A
                if (cur >= 6.35) revealHit3();

                // Pad 4: 9.60s -> '26
                if (cur >= 9.60) revealHit4();

                // Full drop: 12.85s (0:13) -> full page
                if (cur >= 12.85) revealFullDrop();

                // Fade out near end of track
                if (dur && !isNaN(dur) && dur > 0 && (dur - cur <= 4.5)) {
                    var left = dur - cur;
                    audio.volume = Math.max(0, Math.pow(left / 4.5, 1.5));
                }

                if (!audio.ended) {
                    requestAnimationFrame(trackAudio);
                }
            }

            var btn = document.getElementById('enterBtn');
            if (btn) {
                btn.addEventListener('click', startExperience);
                btn.addEventListener('touchend', function (e) {
                    e.preventDefault();
                    startExperience();
                }, { passive: false });
            }

            // Preload audio buffer immediately
            if (audio) {
                try { audio.load(); } catch (e) {}
            }
        })();
    </script>

    <script>
        /* Floating Embers — Sparks rising from the fog */
        (function () {
            const canvas = document.getElementById('embersCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let W, H;
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const EMBER_COUNT = Math.min(50, Math.floor(window.innerWidth / 22));
            const embers = [];

            // Color palette matching the dark crimson background
            const COLORS = [
                { h: 355, s: 60, l: 55 },  // soft crimson
                { h: 0,   s: 50, l: 50 },  // muted red
                { h: 15,  s: 40, l: 60 },  // warm pale ember
                { h: 350, s: 45, l: 55 },  // dusty rose
                { h: 20,  s: 30, l: 65 },  // faint warm white
            ];

            function createEmber() {
                const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                // Spawn from the bottom 15% (fog zone)
                const spawnY = H - (Math.random() * H * 0.15);
                // Cluster more toward center but allow full width spread
                const spawnX = W * 0.15 + Math.random() * W * 0.7;

                return {
                    x: spawnX,
                    y: spawnY,
                    size: Math.random() * 2 + 1,
                    speedY: -(Math.random() * 0.8 + 0.3),
                    speedX: (Math.random() - 0.5) * 0.3,
                    drift: Math.random() * Math.PI * 2,
                    driftSpeed: Math.random() * 0.006 + 0.002,
                    driftAmp: Math.random() * 0.4 + 0.15,
                    maxOpacity: Math.random() * 0.45 + 0.25,
                    spikeLen: Math.random() * 6 + 3,  // length of star spikes
                    opacity: 0,
                    startY: spawnY,
                    color: color,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: Math.random() * 0.02 + 0.01,
                };
            }

            for (let i = 0; i < EMBER_COUNT; i++) {
                const e = createEmber();
                // Scatter initial positions across full height for first frame
                e.y = H * 0.3 + Math.random() * H * 0.7;
                e.startY = e.y;
                e.opacity = e.maxOpacity * (1 - (e.startY - e.y) / e.startY);
                embers.push(e);
            }

            function drawEmber(e) {
                const pulseGlow = 0.5 + 0.5 * Math.sin(e.pulse);
                const alpha = e.opacity * (0.5 + 0.5 * pulseGlow);
                if (alpha < 0.008) return;

                const c = e.color;

                // Draw 4-pointed star spikes (cross shape)
                const spikeLen = e.spikeLen * (0.8 + pulseGlow * 0.4);
                ctx.save();
                ctx.globalAlpha = alpha * 0.5;
                ctx.strokeStyle = `hsla(${c.h}, ${c.s}%, ${c.l}%, ${alpha * 0.6})`;
                ctx.lineWidth = 0.5;

                // Vertical spike
                ctx.beginPath();
                ctx.moveTo(e.x, e.y - spikeLen);
                ctx.lineTo(e.x, e.y + spikeLen);
                ctx.stroke();

                // Horizontal spike
                ctx.beginPath();
                ctx.moveTo(e.x - spikeLen, e.y);
                ctx.lineTo(e.x + spikeLen, e.y);
                ctx.stroke();

                // Shorter diagonal spikes
                const diagLen = spikeLen * 0.45;
                ctx.globalAlpha = alpha * 0.25;
                ctx.beginPath();
                ctx.moveTo(e.x - diagLen, e.y - diagLen);
                ctx.lineTo(e.x + diagLen, e.y + diagLen);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.x + diagLen, e.y - diagLen);
                ctx.lineTo(e.x - diagLen, e.y + diagLen);
                ctx.stroke();

                ctx.restore();

                // Tiny bright center dot
                ctx.fillStyle = `hsla(${c.h}, ${c.s - 20}%, ${c.l + 25}%, ${alpha * 0.9})`;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }

            function animate() {
                ctx.clearRect(0, 0, W, H);

                for (let i = 0; i < embers.length; i++) {
                    const e = embers[i];

                    e.drift += e.driftSpeed;
                    e.pulse += e.pulseSpeed;
                    e.x += e.speedX + Math.sin(e.drift) * e.driftAmp;
                    e.y += e.speedY;

                    // Opacity based on how far it has traveled from spawn
                    const traveled = (e.startY - e.y) / e.startY;
                    e.opacity = e.maxOpacity * Math.max(0, 1 - traveled * 1.2);

                    // Reset when off-screen or fully faded
                    if (e.y < -20 || e.opacity <= 0 || e.x < -30 || e.x > W + 30) {
                        embers[i] = createEmber();
                    }

                    drawEmber(e);
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>

    <script>
        /* Fog Particle System with Automated Procedural Fallback */
        (function () {
            const canvas = document.getElementById("myCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            const canvasWidth = 1600;
            const canvasHeight = 250;

            let pCount = 0;
            let pCollection = [];
            const puffs = 1;
            const particlesPerPuff = 75;

            // Image setup
            const smokeImage = new Image();
            let isImageLoaded = false;
            let useProceduralFallback = false;

            smokeImage.onload = function () {
                isImageLoaded = true;
                useProceduralFallback = false;
            };

            smokeImage.onerror = function () {
                isImageLoaded = false;
                useProceduralFallback = true;
                console.log("Smoke texture image missing: Using procedural crimson particle renderer.");
            };

            // Attempt loading local image asset
            smokeImage.src = 'smoke_eb1c2c.png';

            function randBetween(n1, n2) {
                return (Math.random() * (n2 - n1)) + n1;
            }

            function addNewParticle(delay) {
                const p = {};
                p.top = canvasHeight - 20;
                p.left = randBetween(-100, canvasWidth - 50);

                p.start = new Date().getTime() + delay;
                p.life = randBetween(6500, 9500);
                p.speedUp = randBetween(16, 36);
                p.speedRight = randBetween(-8, 16);

                p.rot = randBetween(-0.5, 0.5);
                p.startOpacity = randBetween(0.25, 0.45);
                p.newTop = p.top;
                p.newLeft = p.left;
                p.size = randBetween(200, 360);
                p.growth = randBetween(15, 32);

                pCollection[pCount] = p;
                pCount++;
            }

            for (let i1 = 0; i1 < puffs; i1++) {
                const puffDelay = i1 * 1500;
                for (let i2 = 0; i2 < particlesPerPuff; i2++) {
                    addNewParticle((i2 * 80) + puffDelay);
                }
            }

            // Procedural gradient drawer for fallback
            function drawProceduralPuff(x, y, radius, opacity) {
                ctx.save();
                const centerX = x + radius / 2;
                const centerY = y + radius / 2;
                const grad = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, radius / 2
                );

                grad.addColorStop(0, `rgba(235, 28, 44, ${opacity * 0.55})`);
                grad.addColorStop(0.35, `rgba(180, 20, 35, ${opacity * 0.35})`);
                grad.addColorStop(0.7, `rgba(100, 10, 20, ${opacity * 0.12})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const now = new Date().getTime();

                for (let i = 0; i < pCount; i++) {
                    const p = pCollection[i];
                    let td = now - p.start;
                    let frac = td / p.life;

                    // Infinite recycling loop
                    if (td > p.life) {
                        p.start = now;
                        p.top = canvasHeight - randBetween(0, 40);
                        p.left = randBetween(-100, canvasWidth - 50);
                        td = 0;
                        frac = 0;
                    }

                    if (td > 0) {
                        const newTop = p.top - (p.speedUp * (td / 1000));
                        const newLeft = p.left + (p.speedRight * (td / 1000));
                        const newOpacity = Math.max(p.startOpacity * Math.sin(frac * Math.PI), 0);
                        const newSize = p.size + (p.growth * (td / 1000));
                        p.newTop = newTop;
                        p.newLeft = newLeft;

                        if (newOpacity > 0.005) {
                            if (isImageLoaded) {
                                ctx.globalAlpha = newOpacity;
                                ctx.drawImage(smokeImage, newLeft, newTop, newSize, newSize);
                            } else if (useProceduralFallback) {
                                drawProceduralPuff(newLeft, newTop, newSize, newOpacity);
                            }
                        }
                    }
                }

                requestAnimationFrame(draw);
            }

            // Start animation loop immediately
            draw();
        })();
    </script>

    <script>
        /* Responsive DriftWall Engine — Dynamic Columns & Seamless Infinite Drift */
        (function () {
            const ITEMS = [
                { image: 'https://images.unsplash.com/photo-1517483000871-1dbf64a6e1c6?w=600&h=400&fit=crop', title: 'Red Smoke' },
                { image: 'https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=600&h=400&fit=crop', title: 'Red Abstract' },
                { image: 'https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=600&h=400&fit=crop', title: 'Sunset Fire' },
                { image: 'https://images.unsplash.com/photo-1549317661-bd32c8ce0484?w=600&h=400&fit=crop', title: 'Red Neon' },
                { image: 'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600&h=400&fit=crop', title: 'Dark Glow' },
                { image: 'https://images.unsplash.com/photo-1604076913837-52ab5f6e5cc4?w=600&h=400&fit=crop', title: 'Flames' },
                { image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&h=400&fit=crop', title: 'Night Mountain' },
                { image: 'https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?w=600&h=400&fit=crop', title: 'Dark Sky' },
                { image: 'https://images.unsplash.com/photo-1542332213-31f87348057f?w=600&h=400&fit=crop', title: 'Red Light' },
                { image: 'https://images.unsplash.com/photo-1494891848038-7bd202a2afeb?w=600&h=400&fit=crop', title: 'Dark City' },
                { image: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=600&h=400&fit=crop', title: 'Aurora' },
                { image: 'https://images.unsplash.com/photo-1507400492013-162706c8c05e?w=600&h=400&fit=crop', title: 'Lava' },
                { image: 'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=600&h=400&fit=crop', title: 'Dark Clouds' },
                { image: 'https://images.unsplash.com/photo-1470813740244-df37b8c1edcb?w=600&h=400&fit=crop', title: 'Night Stars' },
                { image: 'https://images.unsplash.com/photo-1516410529446-2c777cb7366d?w=600&h=400&fit=crop', title: 'Fire Sparks' },
            ];

            const plane = document.getElementById('driftPlane');
            let columns = [];
            let currentColCount = 0;
            let lastWidth = window.innerWidth;

            /* Compute dynamic column count based on screen viewport breakpoint */
            function getColumnCount() {
                const w = window.innerWidth;
                if (w < 600) return 3;        // Phones: 3 columns (allowed to overflow)
                if (w < 1024) return 3;       // Tablets / Foldables: 3 columns
                if (w < 1440) return 4;       // Laptops / Desktops: 4 columns
                return 5;                     // Widescreen Monitors: 5 columns
            }

            function colFactor(index) {
                const pseudo = ((index * 0.6180339887 + 0.35) % 1) * 2 - 1;
                return 1 + 0.45 * pseudo;
            }

            /* Rebuild DOM layout on initialize or window resize */
            function buildWall() {
                const colCount = getColumnCount();
                currentColCount = colCount;

                // Calculate geometry parameters
                const winW = window.innerWidth;
                const winH = window.innerHeight;

                // Account for 3D rotation coverage angle
                const coverageMultiplier = winW < 600 ? 1.35 : 1.25;
                const gap = winW < 600 ? 12 : (winW < 1024 ? 16 : 20);

                let tileW = (winW * coverageMultiplier - ((colCount - 1) * gap)) / colCount;
                if (tileW < 120) tileW = 120;
                const tileH = tileW * (172 / 340);

                // Set CSS variables
                document.documentElement.style.setProperty('--tile-w', `${tileW}px`);
                document.documentElement.style.setProperty('--tile-h', `${tileH}px`);
                document.documentElement.style.setProperty('--tile-gap', `${gap}px`);

                // Clear existing DOM plane columns
                plane.innerHTML = '';
                columns = [];

                // Distribute items round-robin into active columns
                const colData = Array.from({ length: colCount }, () => []);
                ITEMS.forEach((item, i) => colData[i % colCount].push(item));

                const SPEED = winW < 600 ? 32 : 42; // Slower, smoother drift on mobile

                colData.forEach((items, ci) => {
                    const col = document.createElement('div');
                    col.className = 'drift-column';

                    const setHeight = items.length * (tileH + gap);
                    const copies = Math.max(4, Math.ceil((winH * 3) / setHeight) + 2);

                    for (let c = 0; c < copies; c++) {
                        items.forEach(item => {
                            const tile = document.createElement('div');
                            tile.className = 'drift-tile';

                            const img = document.createElement('img');
                            img.src = item.image;
                            img.alt = item.title;
                            img.loading = 'lazy';
                            img.onerror = function () {
                                // Fallback stylized gradient if Unsplash image fails to load
                                this.style.display = 'none';
                                tile.style.background = 'linear-gradient(135deg, #4a060d, #120204)';
                            };

                            tile.appendChild(img);
                            col.appendChild(tile);
                        });
                    }

                    plane.appendChild(col);

                    const dir = ci % 2 === 0 ? 1 : -1; // Alternate scroll directions
                    const vel = SPEED * colFactor(ci) * dir;
                    const baseOffset = setHeight;
                    const startOffset = baseOffset + (Math.random() * setHeight);

                    columns.push({ el: col, vel, wrapH: setHeight, offset: startOffset, baseOffset });
                });
            }

            // Animation Loop — constant delta-time smooth scrolling
            let lastTs = null;
            function tick(ts) {
                if (!lastTs) lastTs = ts;
                const dt = (ts - lastTs) / 1000;
                lastTs = ts;

                // Cap maximum delta frame jump (e.g. tab switching)
                const clampedDt = Math.min(dt, 0.1);

                columns.forEach(c => {
                    c.offset += c.vel * clampedDt;
                    if (c.offset > c.baseOffset + c.wrapH) c.offset -= c.wrapH;
                    if (c.offset < c.baseOffset) c.offset += c.wrapH;

                    c.el.style.transform = `translateY(${-c.offset}px)`;
                });

                requestAnimationFrame(tick);
            }

            // Build initial grid wall & start loop
            buildWall();
            requestAnimationFrame(tick);

            // Handle Resize & Device Orientation change with debouncing
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // Rebuild wall if column count changes or width changes significantly (> 40px)
                    if (getColumnCount() !== currentColCount || Math.abs(window.innerWidth - lastWidth) > 40) {
                        lastWidth = window.innerWidth;
                        buildWall();
                    }
                }, 150);
            });
        })();
    </script>

    <script type="module">
        import { VFX } from "https://esm.sh/@vfx-js/core";

        let vfxInitialized = false;

        window.initComingSoonVFX = function () {
            if (vfxInitialized) return;
            vfxInitialized = true;

            try {
                const vfx = new VFX();
                const comingSoonText = document.querySelector('.target-coming-soon');
                if (!comingSoonText) return;

                const applyGlitch = (el, overflowAmount = 40) => {
                    if (!el) return;
                    if (typeof vfx.add === 'function') {
                        vfx.add(el, {
                            shader: 'rgbShift',
                            overflow: overflowAmount
                        });
                    } else if (typeof vfx.addHTML === 'function') {
                        vfx.addHTML(el, {
                            shader: 'rgbShift',
                            release: 10
                        });
                    }
                };

                applyGlitch(comingSoonText, 40);
            } catch (err) {
                console.log("VFX-JS initialized in fallback mode.");
            }
        };

        // If overlay was already dropped before this module loaded, trigger immediately
        if (window.comingSoonPageAppeared || !document.getElementById('intro-overlay')) {
            window.initComingSoonVFX();
        }
    </script>
